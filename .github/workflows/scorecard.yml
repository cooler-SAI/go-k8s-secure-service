name: OpenSSF Scorecard

on:
  # Re-evaluate when branch protection rules change.
  branch_protection_rule:
  schedule:
    - cron: '30 6 * * 2' # Weekly on Tuesday at 06:30 UTC
  push:
    branches: [ "main" ]

# Read-only by default; the job below requests only what it needs.
permissions: read-all

# All third-party actions are pinned to full commit SHAs.

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Upload SARIF to GitHub Code Scanning
      id-token: write # Publish results and obtain the public badge (OIDC)
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing feeds the public badge and the scorecard.dev viewer.
          # Only works on public repositories.
          publish_results: true

      - name: Upload results as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: scorecard
