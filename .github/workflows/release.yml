name: Release (Build, SBOM, Sign)

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

# All third-party actions are pinned to full commit SHAs.

jobs:
  release:
    name: Build, Push, SBOM & Cosign Signature
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Push the image to GHCR
      id-token: write # Keyless Cosign signing: OIDC token exchanged for a Fulcio certificate
    env:
      COSIGN_VERSION: v3.1.4
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Registry paths must be lowercase; the repository owner may not be.
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # SBOMs describe the image that was actually pushed, addressed by digest.
      - name: Generate SBOM (SPDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: '${{ env.IMAGE }}@${{ steps.build.outputs.digest }}'
          format: 'spdx-json'
          output: 'sbom.spdx.json'

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: '${{ env.IMAGE }}@${{ steps.build.outputs.digest }}'
          format: 'cyclonedx'
          output: 'sbom.cdx.json'

      # Keyless: no long-lived key. The signature is bound to this workflow's
      # OIDC identity and logged in the Rekor transparency log. Signing by
      # digest (never by tag) so the signature covers exactly what was built.
      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest SBOMs (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${IMAGE}@${DIGEST}"

      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cdx.json
