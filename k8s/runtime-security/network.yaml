# Runtime enforcement with Cilium Tetragon: the server process may only
# open outbound TCP connections to an OpenTelemetry Collector (OTLP/HTTP,
# port 4318). Any other outbound connection kills the process: a reverse
# shell, exfiltration or lateral movement.
#
# There is no rule for listening sockets. Tetragon 1.8.0 evaluates NotSPort
# with more than one value as true for every port, so a rule "listen only on
# 8080 and 9090" killed the server on its own ports (verified in CI), and a
# SPort -> NoPost selector before a catch-all Sigkill does not help, because
# the Sigkill selector still applies. A bind shell on another port is still
# unreachable: k8s/networkpolicy.yaml only admits traffic to 8080 and 9090.
#
# This complements k8s/networkpolicy.yaml, which drops the packets at the
# network level. The NetworkPolicy cannot tell which process opened a
# socket; Tetragon acts on the process itself and reports the attempt. A
# killed process may already have sent the first SYN, so keep the
# NetworkPolicy as the packet-level control.
#
# Keep the port in sync with the OTLP egress rule in networkpolicy.yaml if
# you change it.
#
# Requires Tetragon (tested with 1.8.0). Apply in the service's namespace:
#   kubectl apply -f k8s/runtime-security/
apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: go-k8s-secure-service-network
spec:
  podSelector:
    matchLabels:
      app: go-k8s-secure-service
  containerSelector:
    matchExpressions:
      - key: name
        operator: In
        values: [server]
  kprobes:
    # An outbound TCP connection is being opened.
    - call: tcp_connect
      syscall: false
      message: "Blocked an outbound TCP connection"
      tags: [runtime-security, network]
      args:
        - index: 0
          type: sock
      selectors:
        - matchArgs:
            - index: 0
              operator: NotDPort
              values:
                - "4318" # OTLP/HTTP trace export
          matchActions:
            - action: Sigkill
