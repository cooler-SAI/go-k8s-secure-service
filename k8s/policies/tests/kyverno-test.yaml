apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pod-security-policies
policies:
  - ../disallow-root-user.yaml
  - ../disallow-privileged-containers.yaml
  - ../require-probes.yaml
  - ../require-resource-limits.yaml
resources:
  - resources.yaml
  - ../../deployment.yaml
# ValidatingPolicies report one result per policy (not per rule). The
# Deployment is checked through the pod-controller variants Kyverno
# auto-generates.
results:
  - policy: disallow-root-user
    isValidatingPolicy: true
    kind: Pod
    resources: [good, bad-privileged, bad-no-probes, bad-no-limits]
    result: pass
  - policy: disallow-root-user
    isValidatingPolicy: true
    kind: Pod
    resources: [bad-root-container, bad-root-pod]
    result: fail
  - policy: disallow-privileged-containers
    isValidatingPolicy: true
    kind: Pod
    resources: [good, bad-root-container, bad-root-pod, bad-no-probes, bad-no-limits]
    result: pass
  - policy: disallow-privileged-containers
    isValidatingPolicy: true
    kind: Pod
    resources: [bad-privileged]
    result: fail
  - policy: require-probes
    isValidatingPolicy: true
    kind: Pod
    resources: [good, bad-root-container, bad-root-pod, bad-privileged, bad-no-limits]
    result: pass
  - policy: require-probes
    isValidatingPolicy: true
    kind: Pod
    resources: [bad-no-probes]
    result: fail
  - policy: require-resource-limits
    isValidatingPolicy: true
    kind: Pod
    resources: [good, bad-root-container, bad-root-pod, bad-privileged, bad-no-probes]
    result: pass
  - policy: require-resource-limits
    isValidatingPolicy: true
    kind: Pod
    resources: [bad-no-limits]
    result: fail
  - policy: disallow-root-user
    isValidatingPolicy: true
    kind: Deployment
    resources: [go-k8s-secure-service]
    result: pass
  - policy: disallow-privileged-containers
    isValidatingPolicy: true
    kind: Deployment
    resources: [go-k8s-secure-service]
    result: pass
  - policy: require-probes
    isValidatingPolicy: true
    kind: Deployment
    resources: [go-k8s-secure-service]
    result: pass
  - policy: require-resource-limits
    isValidatingPolicy: true
    kind: Deployment
    resources: [go-k8s-secure-service]
    result: pass
