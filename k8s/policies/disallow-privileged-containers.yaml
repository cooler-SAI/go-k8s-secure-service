apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/title: Disallow Privileged Containers
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Privileged containers disable most security mechanisms and have access
      to all host devices. securityContext.privileged must be unset or false
      for containers, init containers and ephemeral containers.
spec:
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-public, kube-node-lease, kyverno]
  # Kyverno generates equivalent checks for these pod controllers, rewriting
  # object.spec to the pod template.
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, replicasets, jobs, cronjobs]
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers
        + object.spec.?initContainers.orValue([])
        + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(c,
          !c.?securityContext.?privileged.orValue(false))
      message: >-
        Privileged containers are not allowed. securityContext.privileged
        must be unset or false.
