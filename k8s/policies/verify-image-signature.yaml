apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signature
  annotations:
    policies.kyverno.io/title: Verify Image Signature (Cosign Keyless)
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Images published to ghcr.io/cooler-sai/go-k8s-secure-service must carry
      a Cosign keyless signature created by this repository's release
      workflow (.github/workflows/release.yml) on a v* tag. The signature is
      verified against Sigstore's Fulcio identity and the Rekor transparency
      log, and the image reference is rewritten to its verified digest.
spec:
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-cosign-keyless-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        # Cosign v3 (used by release.yml) stores signatures as Sigstore
        # bundles attached via OCI referrers, not as legacy
        # sha256-<digest>.sig tags. The default "Cosign" type only looks for
        # the legacy tags and rejects every release with "no signatures found".
        - type: SigstoreBundle
          imageReferences:
            - "ghcr.io/cooler-sai/go-k8s-secure-service*"
          failureAction: Enforce
          mutateDigest: true
          verifyDigest: true
          required: true
          attestors:
            - entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subjectRegExp: '^https://github\.com/cooler-SAI/go-k8s-secure-service/\.github/workflows/release\.yml@refs/tags/v.*$'
                    rekor:
                      url: "https://rekor.sigstore.dev"
