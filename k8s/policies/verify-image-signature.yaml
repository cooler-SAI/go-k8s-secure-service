apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-image-signature
  annotations:
    policies.kyverno.io/title: Verify Image Signature (Cosign Keyless)
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Images published to ghcr.io/cooler-sai/go-k8s-secure-service must carry
      a Cosign keyless signature created by this repository's release
      workflow (.github/workflows/release.yml) on a v* tag. The signature is
      verified against Sigstore's Fulcio identity and the Rekor transparency
      log, and the image reference is rewritten to its verified digest.
spec:
  validationActions:
    - Deny
  webhookConfiguration:
    timeoutSeconds: 30
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, replicasets, jobs, cronjobs]
  # Only these images are verified; other images are not checked.
  matchImageReferences:
    - glob: "ghcr.io/cooler-sai/go-k8s-secure-service*"
  validationConfigurations:
    mutateDigest: true
    verifyDigest: true
    required: true
  attestors:
    - name: release
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subjectRegExp: '^https://github\.com/cooler-SAI/go-k8s-secure-service/\.github/workflows/release\.yml@refs/tags/v.*$'
        ctlog:
          url: "https://rekor.sigstore.dev"
  validations:
    - expression: >-
        images.containers.map(image,
          verifyImageSignatures(image, [attestors.release])).all(e, e > 0)
      message: >-
        Images from ghcr.io/cooler-sai/go-k8s-secure-service must be signed by
        this repository's release workflow.
