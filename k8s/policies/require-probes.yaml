apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-probes
  annotations:
    policies.kyverno.io/title: Require Liveness and Readiness Probes
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Every container must define a livenessProbe and a readinessProbe so the
      kubelet can restart hung containers and Services only route traffic to
      ready pods. Init and ephemeral containers are not checked.
spec:
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-public, kube-node-lease, kyverno]
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, replicasets, jobs, cronjobs]
  validations:
    - expression: object.spec.containers.all(c, has(c.livenessProbe))
      message: Every container must define a livenessProbe.
    - expression: object.spec.containers.all(c, has(c.readinessProbe))
      message: Every container must define a readinessProbe.
