apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Every container must set CPU and memory limits so a single pod cannot
      starve the node. Init and ephemeral containers are not checked.
spec:
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-public, kube-node-lease, kyverno]
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, replicasets, jobs, cronjobs]
  validations:
    - expression: >-
        object.spec.containers.all(c,
          'cpu' in c.?resources.?limits.orValue({}) &&
          'memory' in c.?resources.?limits.orValue({}))
      message: Every container must set resources.limits.cpu and resources.limits.memory.
