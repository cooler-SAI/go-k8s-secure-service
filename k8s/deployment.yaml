apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-k8s-secure-service
  labels:
    app: go-k8s-secure-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-k8s-secure-service
  template:
    metadata:
      labels:
        app: go-k8s-secure-service
      # For Prometheus setups that discover pods by annotation. With the
      # Prometheus Operator, use a PodMonitor on the "metrics" port instead.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      # Pod-level security settings
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: go-k8s-secure-service:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            # Prometheus /metrics. Deliberately not part of the Service, so it
            # is never reachable through the Ingress.
            - containerPort: 9090
              name: metrics
          env:
            # Soft memory limit for the Go GC, ~90% of limits.memory (64Mi),
            # so the runtime collects harder before the kernel OOM-kills it.
            # Keep in sync with resources.limits.memory.
            - name: GOMEMLIMIT
              value: "57MiB"
            # OpenTelemetry tracing. Spans carry the pod's identity as
            # resource attributes (filled from the downward API below).
            - name: OTEL_SERVICE_NAME
              value: go-k8s-secure-service
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.name=$(K8S_POD_NAME),k8s.namespace.name=$(K8S_NAMESPACE_NAME),k8s.node.name=$(K8S_NODE_NAME)
            # To export spans, point this at your OpenTelemetry Collector and
            # allow egress to it in networkpolicy.yaml (egress is denied by
            # default). Without it, traceparent is still propagated and trace
            # IDs are logged, but no spans leave the pod.
            # - name: OTEL_EXPORTER_OTLP_ENDPOINT
            #   value: http://otel-collector.observability.svc:4318
          # Container-level security settings
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Resource limits required by production policies
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          # Health and readiness checks
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
