apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-k8s-secure-service
  labels:
    app: go-k8s-secure-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-k8s-secure-service
  template:
    metadata:
      labels:
        app: go-k8s-secure-service
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      # Pod-level security settings
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: go-k8s-secure-service:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            # Soft memory limit for the Go GC, ~90% of limits.memory (64Mi),
            # so the runtime collects harder before the kernel OOM-kills it.
            # Keep in sync with resources.limits.memory.
            - name: GOMEMLIMIT
              value: "57MiB"
          # Container-level security settings
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Resource limits required by production policies
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          # Health and readiness checks
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
