apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: go-k8s-secure-service
  labels:
    app: go-k8s-secure-service
spec:
  podSelector:
    matchLabels:
      app: go-k8s-secure-service
  # Listing both types with no matching egress rules makes this
  # default-deny in both directions for the selected pods.
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The HTTP port is reachable only from:
    #   - pods in the same namespace (e.g. other services calling it), and
    #   - the ingress controller's namespace.
    # Adjust the namespace name to match your ingress controller or Gateway.
    # Kubelet health probes originate from the node and are not blocked by
    # NetworkPolicy on standard CNIs.
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: http
    # The metrics port is reachable only from the monitoring namespace
    # (Prometheus). Adjust the namespace name to match your setup.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: metrics
  # No egress rules: the service makes no outbound calls (not even DNS),
  # so all egress is denied. Add explicit rules here if that changes.
  #
  # To export traces (OTEL_EXPORTER_OTLP_ENDPOINT in deployment.yaml), allow
  # OTLP/HTTP to the collector and DNS to resolve its name, e.g.:
  #
  # egress:
  #   - to:
  #       - namespaceSelector:
  #           matchLabels:
  #             kubernetes.io/metadata.name: observability
  #     ports:
  #       - protocol: TCP
  #         port: 4318
  #   - to:
  #       - namespaceSelector:
  #           matchLabels:
  #             kubernetes.io/metadata.name: kube-system
  #         podSelector:
  #           matchLabels:
  #             k8s-app: kube-dns
  #     ports:
  #       - protocol: UDP
  #         port: 53
  #       - protocol: TCP
  #         port: 53
  egress: []
