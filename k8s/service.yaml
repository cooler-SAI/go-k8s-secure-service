apiVersion: v1
kind: Service
metadata:
  name: go-k8s-secure-service
  labels:
    app: go-k8s-secure-service
spec:
  # Cluster-internal only; expose externally through an Ingress or Gateway.
  type: ClusterIP
  selector:
    app: go-k8s-secure-service
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
