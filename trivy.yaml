# Trivy Configuration File
# Documentation: https://aquasecurity.github.io/trivy/latest/docs/references/configuration/config-file/

format: table
exit-code: 0
ignore-unfixed: true

severity:
  - HIGH
  - CRITICAL

scan:
  # Kyverno test fixtures are deliberately insecure (root, privileged pods).
  skip-dirs:
    - k8s/policies/tests
  scanners:
    - vuln
    - misconfig
    - secret
